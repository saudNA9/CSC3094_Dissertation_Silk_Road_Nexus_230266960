name: CI/CD - Silk Road Nexus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: saudna9/csc3094-dissertation-silk-road-nexus-230266960-backend
  IMAGE_NAME_FRONTEND: saudna9/csc3094-dissertation-silk-road-nexus-230266960-frontend

jobs:
  tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          PYTHONPATH=. pytest

  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Verify Docker Compose build
        run: docker compose build

  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_BACKEND }}:latest
            ghcr.io/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ghcr.io/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}